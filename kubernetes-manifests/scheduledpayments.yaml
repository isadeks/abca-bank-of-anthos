apiVersion: v1
kind: Service
metadata:
  labels:
    application: bank-of-anthos
    environment: development
    team: accounts
    tier: backend
  name: scheduledpayments
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app: scheduledpayments
    application: bank-of-anthos
    environment: development
    team: accounts
    tier: backend
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    application: bank-of-anthos
    environment: development
    team: accounts
    tier: backend
  name: scheduledpayments
spec:
  selector:
    matchLabels:
      app: scheduledpayments
      application: bank-of-anthos
      environment: development
      team: accounts
      tier: backend
  template:
    metadata:
      annotations:
        proxy.istio.io/config: '{ "holdApplicationUntilProxyStarts": true }'
      labels:
        app: scheduledpayments
        application: bank-of-anthos
        environment: development
        team: accounts
        tier: backend
    spec:
      containers:
        - env:
            - name: VERSION
              value: v0.6.11
            - name: PORT
              value: "8080"
            - name: ENABLE_TRACING
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4317
            - name: OTEL_SERVICE_NAME
              value: scheduledpayments
            - name: K8S_NAMESPACE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.namespace.name=$(K8S_NAMESPACE_NAME)
            - name: LOG_LEVEL
              value: info
            # The runner that sends the payments when they fall due
            - name: ENABLE_RUNNER
              value: "true"
            - name: RUNNER_INTERVAL_SECONDS
              value: "60"
            - name: PRIV_KEY_PATH
              value: /etc/signing/privatekey
          envFrom:
            - configMapRef:
                name: environment-config
            - configMapRef:
                name: accounts-db-config
            - configMapRef:
                name: service-api-config
          image: abca-boa/scheduledpayments
          name: scheduledpayments
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 10
          resources:
            limits:
              cpu: 250m
              ephemeral-storage: 0.25Gi
              memory: 256Mi
            requests:
              cpu: 100m
              ephemeral-storage: 0.25Gi
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - all
            privileged: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /tmp/.ssh
              name: publickey
              readOnly: true
            # The private half of the login key: besides userservice only this service mounts it, to sign the
            # short-lived tokens of the payments it sends. Nothing else of the secret is mounted.
            - mountPath: /etc/signing
              name: signingkey
              readOnly: true
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      # This service never calls the Kubernetes API
      automountServiceAccountToken: false
      serviceAccountName: bank-of-anthos
      terminationGracePeriodSeconds: 5
      volumes:
        - emptyDir: {}
          name: tmp
        - name: publickey
          secret:
            items:
              - key: jwtRS256.key.pub
                path: publickey
            secretName: jwt-key
        - name: signingkey
          secret:
            defaultMode: 288  # octal 0440: readable by the pod's group only
            items:
              - key: jwtRS256.key
                path: privatekey
            secretName: jwt-key
