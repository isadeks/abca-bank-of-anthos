server.port = ${PORT}
handlers = java.util.logging.ConsoleHandler
spring.main.banner-mode=off
# Telemetry is exported over OTLP to the cluster's OpenTelemetry collector.
# OTEL_EXPORTER_OTLP_ENDPOINT is the collector's OTLP/HTTP base URL
# (e.g. http://otel-collector.observability.svc.cluster.local:4318).
# OTEL_SERVICE_NAME and OTEL_RESOURCE_ATTRIBUTES (which carries
# k8s.namespace.name) are read by Spring Boot into the OpenTelemetry Resource.
# tracing on/off toggle
management.tracing.enabled=${ENABLE_TRACING:true}
# if tracing enabled, configuration options:
management.tracing.sampling.probability=1.0
# W3C trace context (traceparent) between services
management.tracing.propagation.consume=w3c
management.tracing.propagation.produce=w3c
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
# metrics on/off toggle
management.otlp.metrics.export.enabled=${ENABLE_METRICS:true}
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
#enables all tomcat metrics to be recorded
server.tomcat.mbeanregistry.enabled=true
#enables jpa metrics to be recorded
spring.jpa.properties.hibernate.generate_statistics=true
#set the jpa database platform
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
