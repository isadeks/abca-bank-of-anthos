<html lang="en">
  <head>
{% include 'shared/html_head.html' %}
  </head>
  <body>
{% include 'shared/platform_banner.html' %}
{% include 'shared/navigation.html' %}
    <main class="container">
      <div class="row mt-5 mb-5">
        <div class="col-lg-8 offset-lg-2">
          <div class="card">
            <div class="card-title header-body">
              <h2 class="mb-4 header-title">Loan calculator</h2>
            </div>
            <div class="card-body">
              <form id="loan-form" novalidate>
                <div class="form-group">
                  <label for="loan-amount" class="bmd-label-floating">Loan amount</label>
                  <input type="number" step="any" min="0" class="form-control" id="loan-amount" required>
                </div>
                <div class="form-group">
                  <label for="loan-rate" class="bmd-label-floating">Yearly interest rate (%)</label>
                  <input type="number" step="any" min="0" class="form-control" id="loan-rate" required>
                </div>
                <div class="form-group">
                  <label for="loan-months" class="bmd-label-floating">Number of months</label>
                  <input type="number" step="1" min="1" class="form-control" id="loan-months" required>
                </div>
                <button type="submit" id="loan-submit" class="btn btn-primary btn-raised">Calculate</button>
              </form>
              <p id="loan-result" class="mt-4" role="status"></p>
              <script>
                document.getElementById('loan-form').addEventListener('submit', function (e) {
                  e.preventDefault();
                  var amount = parseFloat(document.getElementById('loan-amount').value);
                  var rate = parseFloat(document.getElementById('loan-rate').value);
                  var months = parseFloat(document.getElementById('loan-months').value);
                  var out = document.getElementById('loan-result');
                  if (!isFinite(amount) || amount <= 0 || !isFinite(rate) || rate < 0 ||
                      !isFinite(months) || months < 1 || Math.floor(months) !== months) {
                    out.textContent = 'Please enter a positive amount, a rate of 0 or more and a whole number of months.';
                    return;
                  }
                  var r = rate / 100 / 12;
                  var payment = r === 0 ? amount / months :
                    amount * r / (1 - Math.pow(1 + r, -months));
                  out.textContent = 'Monthly payment: $' + payment.toFixed(2);
                });
              </script>
            </div>
          </div>
        </div>
      </div>
    </main>
{% include 'shared/footer.html' %}
{% include 'shared/scripts.html' %}
  </body>
</html>
