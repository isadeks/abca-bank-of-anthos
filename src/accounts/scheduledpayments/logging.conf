[loggers]
keys=root, gunicorn.error, scheduledpayments

[handlers]
keys=console

[formatters]
keys=generic

[logger_root]
handlers=console

[logger_gunicorn.error]
formatter=generic
handlers=console
propagate=0
qualname=gunicorn.error

[logger_scheduledpayments]
formatter=generic
handlers=console
propagate=0
qualname=scheduledpayments

[handler_console]
class=StreamHandler
formatter=generic
args=(sys.stdout, )

[formatter_generic]
format={"timestamp": "%(asctime)s", "message": "%(funcName)s | %(message)s", "severity": "%(levelname)s", "trace_id": "%(trace_id)s", "span_id": "%(span_id)s"}
datefmt=%Y-%m-%d %H:%M:%S
class=trace_logging.TraceContextFormatter
