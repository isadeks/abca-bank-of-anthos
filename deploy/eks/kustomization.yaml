# Bank of Anthos on Amazon EKS (Auto Mode). See README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: boa
# Auto Mode consolidation evicted the databases (emptyDir) and services mid-test ("Evicted pod:
# Underutilized"), resetting their data. Bank of Anthos pods are never disrupted voluntarily.
commonAnnotations:
  karpenter.sh/do-not-disrupt: "true"
resources:
  - namespace.yaml
  - ../../kubernetes-manifests
patches:
  - path: frontend-lb.yaml
  - target: {kind: ServiceAccount, name: bank-of-anthos}
    patch: |-
      - op: remove
        path: /metadata/annotations
  # The images are linux/amd64 only; Auto Mode may also launch Graviton nodes.
  - target: {kind: Deployment}
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value: {kubernetes.io/arch: amd64}
  - target: {kind: StatefulSet}
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value: {kubernetes.io/arch: amd64}
  # Database passwords come from the Secret `db-credentials` that the platform creates in every
  # namespace (keys ACCOUNTS_DB_PASSWORD, LEDGER_DB_PASSWORD); it is never committed. The plain-text
  # passwords (and the URI that embeds one) are removed from the ConfigMaps and rebuilt in the pods.
  - target: {kind: ConfigMap, name: accounts-db-config}
    patch: |-
      - op: remove
        path: /data/POSTGRES_PASSWORD
      - op: remove
        path: /data/ACCOUNTS_DB_URI
  - target: {kind: ConfigMap, name: ledger-db-config}
    patch: |-
      - op: remove
        path: /data/POSTGRES_PASSWORD
      - op: remove
        path: /data/SPRING_DATASOURCE_PASSWORD
  - target: {kind: StatefulSet, name: accounts-db}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: POSTGRES_PASSWORD
          valueFrom: {secretKeyRef: {name: db-credentials, key: ACCOUNTS_DB_PASSWORD}}
  - target: {kind: StatefulSet, name: ledger-db}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: POSTGRES_PASSWORD
          valueFrom: {secretKeyRef: {name: db-credentials, key: LEDGER_DB_PASSWORD}}
  # $(ACCOUNTS_DB_PASSWORD) is expanded by Kubernetes, so it must be defined before the URI.
  - target: {kind: Deployment, name: userservice}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ACCOUNTS_DB_PASSWORD
          valueFrom: {secretKeyRef: {name: db-credentials, key: ACCOUNTS_DB_PASSWORD}}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ACCOUNTS_DB_URI
          value: postgresql://accounts-admin:$(ACCOUNTS_DB_PASSWORD)@accounts-db:5432/accounts-db
  - target: {kind: Deployment, name: "contacts|scheduledpayments"}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ACCOUNTS_DB_PASSWORD
          valueFrom: {secretKeyRef: {name: db-credentials, key: ACCOUNTS_DB_PASSWORD}}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ACCOUNTS_DB_URI
          value: postgresql://accounts-admin:$(ACCOUNTS_DB_PASSWORD)@accounts-db:5432/accounts-db
  - target: {kind: Deployment, name: "balancereader|ledgerwriter|transactionhistory"}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPRING_DATASOURCE_PASSWORD
          valueFrom: {secretKeyRef: {name: db-credentials, key: LEDGER_DB_PASSWORD}}
images:
  - name: us-central1-docker.pkg.dev/bank-of-anthos-ci/bank-of-anthos/frontend
    newName: REGISTRY/abca-boa/frontend
    newTag: v0.6.11
  - name: us-central1-docker.pkg.dev/bank-of-anthos-ci/bank-of-anthos/userservice
    newName: REGISTRY/abca-boa/userservice
    newTag: v0.6.11
  - name: us-central1-docker.pkg.dev/bank-of-anthos-ci/bank-of-anthos/contacts
    newName: REGISTRY/abca-boa/contacts
    newTag: v0.6.11
  - name: us-central1-docker.pkg.dev/bank-of-anthos-ci/bank-of-anthos/ledgerwriter
    newName: REGISTRY/abca-boa/ledgerwriter
    newTag: v0.6.11
  - name: us-central1-docker.pkg.dev/bank-of-anthos-ci/bank-of-anthos/balancereader
    newName: REGISTRY/abca-boa/balancereader
    newTag: v0.6.11
  - name: us-central1-docker.pkg.dev/bank-of-anthos-ci/bank-of-anthos/transactionhistory
    newName: REGISTRY/abca-boa/transactionhistory
    newTag: v0.6.11
  - name: us-central1-docker.pkg.dev/bank-of-anthos-ci/bank-of-anthos/accounts-db
    newName: REGISTRY/abca-boa/accounts-db
    newTag: v0.6.11
  - name: us-central1-docker.pkg.dev/bank-of-anthos-ci/bank-of-anthos/ledger-db
    newName: REGISTRY/abca-boa/ledger-db
    newTag: v0.6.11
  - name: us-central1-docker.pkg.dev/bank-of-anthos-ci/bank-of-anthos/loadgenerator
    newName: REGISTRY/abca-boa/loadgenerator
    newTag: v0.6.11
